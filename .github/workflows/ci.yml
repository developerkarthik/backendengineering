name: Backend CI

on:
    push:
        branches: 
            - main
    pull_request:
        branches:
            - main

jobs:
    lint:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout Code
              uses: actions/Checkout@v4
            
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint




